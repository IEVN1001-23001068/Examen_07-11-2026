<section class="h-full rounded-md border border-gray-300 bg-gray-50 p-4">
  <div class="mb-3 border-b border-gray-300 pb-3">
    <p class="text-sm font-medium text-gray-500">Consulta</p>
    <h3 class="text-lg font-bold text-gray-900">
      {{ formulario.get('modo')?.value === 'dia' ? 'Ventas del día' : 'Ventas del mes' }}
    </h3>
  </div>

  <p *ngIf="error" role="alert" class="mb-3 rounded-md border border-gray-300 bg-red-50 p-3 text-sm text-red-800">
    {{ error }}
  </p>

  <div class="max-h-52 min-h-[210px] overflow-y-auto">
    <div *ngIf="consultado && ventas.length > 0">
      <article *ngFor="let v of ventas" class="border-b border-gray-200 py-3 last:border-b-0">
        <div class="flex items-start justify-between gap-3">
          <div>
            <p class="font-semibold text-gray-900">{{ v.nombre }}</p>
            <a [routerLink]="['/detalles', v.idPedido]" class="text-sm text-gray-500 hover:underline">
              Pedido #{{ v.idPedido }} · Ver detalle
            </a>
          </div>
          <p class="whitespace-nowrap font-semibold text-gray-900">${{ v.totalCosto }}</p>
        </div>
      </article>
    </div>

    <p *ngIf="consultado && ventas.length === 0" class="flex min-h-[210px] items-center justify-center text-center text-sm text-gray-600">
      No hay ventas para este periodo.
    </p>

    <p *ngIf="!consultado" class="flex min-h-[210px] items-center justify-center text-center text-sm text-gray-500">
      Selecciona un periodo para consultar las ventas.
    </p>
  </div>

  <p *ngIf="consultado" class="border-t border-gray-300 py-3 text-right font-bold text-gray-900">
    Ventas totales: ${{ total }}
  </p>

  <form [formGroup]="formulario" (ngSubmit)="consultar()" class="space-y-3 border-t border-gray-300 pt-3">
    <div class="flex flex-wrap gap-x-4 gap-y-2">
      <label class="inline-flex items-center gap-2 text-sm font-medium text-gray-700">
        <input type="radio" formControlName="modo" value="dia"
          class="h-4 w-4 border-gray-300 text-gray-700 focus:ring-gray-500" />
        Por día
      </label>
      <label class="inline-flex items-center gap-2 text-sm font-medium text-gray-700">
        <input type="radio" formControlName="modo" value="mes"
          class="h-4 w-4 border-gray-300 text-gray-700 focus:ring-gray-500" />
        Por mes
      </label>
    </div>

    <div *ngIf="formulario.get('modo')?.value === 'dia'; else filtroMes">
      <select formControlName="dia"
        class="block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500">
        <option *ngFor="let d of dias" [value]="d">{{ d | titlecase }}</option>
      </select>
    </div>
    <ng-template #filtroMes>
      <select formControlName="mes"
        class="block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500">
        <option *ngFor="let m of meses" [value]="m">{{ m | titlecase }}</option>
      </select>
    </ng-template>

    <button type="submit"
      class="w-full rounded-md bg-gray-700 px-4 py-2.5 text-sm font-medium text-white hover:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-gray-300">
      Consultar ventas
    </button>
  </form>
</section>
