<section class="rounded-md border border-gray-300 bg-white p-4 sm:p-5">
  <div class="mb-4 border-b border-gray-300 pb-3">
    <p class="text-sm font-semibold uppercase tracking-wide text-gray-500">Pizzería</p>
    <h2 class="mt-1 text-2xl font-bold text-gray-900">Registro de pedido</h2>
  </div>

  <form [formGroup]="formularioCliente">
    <fieldset class="mb-4 border-b border-gray-300 pb-4">
      <legend class="px-2 text-lg font-semibold text-gray-900">Datos del cliente</legend>
      <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
        <label class="text-sm font-medium text-gray-700">
          Nombre completo
          <input formControlName="nombre" type="text" placeholder="Nombre del cliente"
            class="mt-1 block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500" />
          <span *ngIf="formularioCliente.get('nombre')?.invalid && formularioCliente.get('nombre')?.touched"
            class="mt-1 text-xs font-normal text-red-700">Escribe un nombre de hasta 50 caracteres.</span>
        </label>
        <label class="text-sm font-medium text-gray-700">
          Dirección
          <input formControlName="direccion" type="text" placeholder="Dirección"
            class="mt-1 block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500" />
          <span *ngIf="formularioCliente.get('direccion')?.invalid && formularioCliente.get('direccion')?.touched"
            class="mt-1 text-xs font-normal text-red-700">Escribe una dirección de hasta 60 caracteres.</span>
        </label>
        <label class="text-sm font-medium text-gray-700">
          Teléfono
          <input formControlName="telefono" type="tel" placeholder="Teléfono"
            class="mt-1 block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500" />
          <span *ngIf="formularioCliente.get('telefono')?.invalid && formularioCliente.get('telefono')?.touched"
            class="mt-1 text-xs font-normal text-red-700">Escribe un teléfono de hasta 15 caracteres.</span>
        </label>
        <label class="text-sm font-medium text-gray-700">
          Fecha de compra
          <input formControlName="fecha" type="date"
            class="mt-1 block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500" />
          <span *ngIf="formularioCliente.get('fecha')?.invalid && formularioCliente.get('fecha')?.touched"
            class="mt-1 text-xs font-normal text-red-700">Selecciona la fecha.</span>
        </label>
      </div>
    </fieldset>
  </form>

  <form [formGroup]="formularioPizza" (ngSubmit)="agregarPizza.emit()">
    <fieldset class="pb-1">
      <legend class="px-2 text-lg font-semibold text-gray-900">Información de la pizza</legend>
      <div class="grid gap-4 lg:grid-cols-3">
        <fieldset class="text-sm font-medium text-gray-700">
          <legend>Tamaño de pizza</legend>
          <label *ngFor="let t of tamanos" class="mt-2 flex items-center gap-2">
            <input formControlName="tamano" type="radio" [value]="t"
              class="h-4 w-4 border-gray-300 text-gray-700 focus:ring-gray-500" />
            <span>{{ t | titlecase }} — ${{ precios[t] }}</span>
          </label>
        </fieldset>
        <fieldset formGroupName="ingredientes" class="text-sm font-medium text-gray-700">
          <legend>Ingredientes</legend>
          <label *ngFor="let ingrediente of ingredientesDisponibles" class="mt-2 flex items-center gap-2">
            <input type="checkbox" [formControlName]="ingrediente.id"
              class="h-4 w-4 rounded border-gray-300 text-gray-700 focus:ring-gray-500" />
            <span>{{ ingrediente.nombre }} — ${{ ingrediente.precio }}</span>
          </label>
          <span *ngIf="formularioPizza.get('ingredientes')?.invalid && formularioPizza.get('ingredientes')?.touched"
            class="mt-1 block text-xs font-normal text-red-700">Selecciona al menos un ingrediente.</span>
        </fieldset>
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
          <label class="flex-1 text-sm font-medium text-gray-700">
            Número de pizzas
            <input formControlName="noPizzas" type="number" min="1"
              class="mt-1 block w-full rounded-md border border-gray-300 bg-white p-2.5 text-sm text-gray-900 focus:border-gray-500 focus:ring-gray-500" />
          </label>
          <button type="submit"
            class="rounded-md bg-gray-700 px-5 py-2.5 text-sm font-medium text-white hover:bg-gray-800 focus:outline-none focus:ring-4 focus:ring-gray-300">
            Agregar pizza
          </button>
        </div>
      </div>
    </fieldset>
  </form>
</section>
